<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cul-de-Sac</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{--bg:#eef0e6;--ink:#1f2a1c;--mute:#5d6a56;--cell:#dfe3cf;--edge:#b9bfa3;--hi:#e0803a;--panel:#fff;--line:#c5cab4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c14;--ink:#e8ecdc;--mute:#9aa68f;--cell:#2a3325;--edge:#3b4733;--panel:#1f271c;--line:#37422f}}
:root[data-theme="dark"]{--bg:#161c14;--ink:#e8ecdc;--mute:#9aa68f;--cell:#2a3325;--edge:#3b4733;--panel:#1f271c;--line:#37422f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
main{max-width:1080px;margin:0 auto;padding:16px 12px 40px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.right>.bar:first-child{margin-top:0}
@media (min-width:860px){.layout{grid-template-columns:minmax(0,600px) minmax(300px,1fr);gap:28px;align-items:start}}
h1{font:700 2rem/1.1 "Bricolage Grotesque",Georgia,serif;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
select,button.ctl{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.ctl:disabled,select:disabled,input:disabled{opacity:.45;cursor:default}
label.f{color:var(--mute);font-size:.9rem}
input[type=number]{width:4.5em;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
button.ctl.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.ctl.icon{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px}
button.ctl.icon svg{width:18px;height:18px;fill:currentColor;display:block}
.navlab{min-width:7.5em;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pl{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pl.on{border-color:var(--hi)}
.pl b{font:700 1.6rem "Bricolage Grotesque",Georgia,serif}
.pl small{color:var(--mute)}
#status{min-height:1.5em;font-weight:600;margin:6px 0}
#board svg{display:block;width:100%;max-width:600px;margin:0 auto;touch-action:manipulation}
#board .sl{cursor:pointer}
#board .sl .pv{opacity:0;transition:opacity .08s}
#board .sl:hover .pv{opacity:.55}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-top:16px}
summary{cursor:pointer;font-weight:600}
details li{margin:4px 0}
.legend{color:var(--mute);font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1 id="gtitle"></h1>
<p class="sub" id="gsub"></p>
<div class="layout">
<div class="left">
<div id="board"></div>
<p class="legend" id="help"></p>
</div>
<aside class="right">
<div class="bar">
  <select id="vr" aria-label="Variant"><option value="0" selected>Cul-de-Sac · 11×14, two pawns each</option><option value="1">Quoridor variant · 9×9, one pawn each</option></select>
</div>
<div class="bar">
  <select id="mode" aria-label="Mode"><option value="ai">Play the computer</option><option value="2p">Two players</option></select>
  <select id="level" aria-label="Computer strength"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select>
  <select id="side" aria-label="Your side"></select>
  <button class="ctl primary" id="new">New game</button>
  <button class="ctl" id="undo">Undo</button>
  <button class="ctl" id="redo">Redo</button>
</div>
<div class="bar" id="nav" role="group" aria-label="Game history">
  <button class="ctl icon" id="nFirst" aria-label="Go to the beginning" title="Go to the beginning"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="2.5" height="14"/><path d="M19 5v14L8 12z"/></svg></button>
  <button class="ctl icon" id="nPrev" aria-label="One move back" title="One move back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14L6 12z"/></svg></button>
  <span class="navlab" id="nlab" aria-live="polite">Move 0 of 0</span>
  <button class="ctl icon" id="nNext" aria-label="One move forward" title="One move forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l11-7z"/></svg></button>
  <button class="ctl icon" id="nLast" aria-label="Go to the last move" title="Go to the last move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l11-7z"/><rect x="17.5" y="5" width="2.5" height="14"/></svg></button>
  <label class="f"><input type="checkbox" id="showLast" checked> Show highlights</label>
</div>
<div class="score">
  <div class="pl" id="p0"><span><span id="n0"></span> <small id="d0"></small></span><b id="s0">0</b></div>
  <div class="pl" id="p1"><span><span id="n1"></span> <small id="d1"></small></span><b id="s1">0</b></div>
</div>
<div id="status" aria-live="polite"></div>
<div id="last" class="legend" style="min-height:2.6em;margin:0 0 8px"></div>
<div class="bar">
  <label class="f">Simulation games <input id="simN" type="number" min="10" max="1000" value="10"></label>
  <label class="f">Random opening moves <input id="simR" type="number" min="0" max="20" value="4"></label>
  <button class="ctl" id="sim">Simulation</button>
</div>
<div id="simout" class="legend" style="white-space:pre-line;margin:0 0 8px"></div>
<details>
<summary>Rules</summary>
<ul id="rules"></ul>
</details>
</aside>
</div>
</main>
<script>
(function(){
/* =====================================================================
   1. GAME DEFINITION  - Cul-de-Sac / Quoridor rules, board geometry, walls, pawn moves
   2. ENGINE           - minimax (beam-limited) computer opponent on shortest-path distances, simulations
   3. INTERFACE        - SVG board, click handling, controls
   Cells c = y*W+x, x = 0..W-1 west to east, y = 0..H-1 north to south (row number = H-y, row 1 in the south).
   Wall centres are the inner grid corners (i,j), i = 1..W-1, j = 1..H-1, index k = (j-1)*(W-1)+(i-1).
   A horizontal wall (o=0) at (i,j) closes the south sides of cells (i-1,j-1) and (i,j-1); a vertical wall (o=1)
   closes the east sides of cells (i-1,j-1) and (i-1,j). bS[c] / bE[c] = 1 when the south / east side of c is closed.
   A move is {t:0 (pawn) k:pawn index, to:cell, ns} or {t:1 (wall), o, k:centre, ns}. In Cul-de-Sac a turn is two
   history steps (pawn move, then wall); in Quoridor it is one (pawn move or wall).
   A state is {pos:pawn cells (first player's pawns first, -1 = removed), hw, vw:wall centres taken, bS, bE,
               res:walls left [P0 blue/all, P0 green, P1 blue/all, P1 green], turn, ph (0 pawn, 1 wall: Cul-de-Sac only),
               w:winner (-1 none, 0, 1, 2 draw), lm:{k,from,to,wall:[o,k]} last turn's actions, ev:text, f:distance fields}.
   ===================================================================== */
var $=function(i){return document.getElementById(i)};

/* ============================ 1. GAME DEFINITION ============================ */
var V=0,W,H,NC,NW,NP,DD,HOMES,GOAL,START;
var VARS=[
  {name:"Cul-de-Sac",W:11,H:14,np:2,walls:[9,9],
   sides:[{name:"Red",color:"#e2392f",dark:"#7a140e",lite:"#ff9b8f",goal:"Yellow’s home spaces"},{name:"Yellow",color:"#f7c62b",dark:"#8a6400",lite:"#fff3b0",goal:"Red’s home spaces"}],
   board:{rim:"#18181a",groove:"#0a0a0b",sq:"#2f2f33",edge:"#3d3d42"},
   wall:[{f:"#5fc4e8",s:"#24819f",n:"blue"},{f:"#22b46a",s:"#0e6e3e",n:"green"}]},
  {name:"Quoridor",W:9,H:9,np:1,walls:[10],
   sides:[{name:"Light",color:"#eec47e",dark:"#8a5a22",lite:"#fff0d2",goal:"the north row"},{name:"Dark",color:"#4b2b1b",dark:"#1a0c05",lite:"#8a5a3e",goal:"the south row"}],
   board:{rim:"#4e2112",groove:"#2e1208",sq:"#6c2f1b",edge:"#7d3a23"},
   wall:[{f:"#e8b46c",s:"#9c6a2c",n:"wood"},{f:"#e8b46c",s:"#9c6a2c",n:"wood"}]}];
var GAME={
  title:"Cul-de-Sac",
  sides:VARS[0].sides,
  subtitle:function(){return V===0?"Philip Slater’s maze race (1975), also sold as Blockade. 11×14 board, two pawns and 9 blue + 9 green walls each. Reach one of the opponent’s home spaces first."
    :"Quoridor variant, after Mirko Marchesi’s game (1997). 9×9 board, one pawn and 10 walls each. Reach the far row first."},
  rules:[
  {h:"Cul-de-Sac: board and setup",items:[
    "An 11×14 board of squares with grooves between them for walls. Red’s home spaces are d4 and h4, Yellow’s are d11 and h11. Each player starts with both pawns on their own home spaces.",
    "Each player has 9 blue walls, which can only be placed horizontally (east–west), and 9 green walls, which can only be placed vertically (north–south). A wall covers the side of exactly two squares and must line up with them.",
    "Red moves first."]},
  {h:"Cul-de-Sac: a turn",items:[
    "On your turn you must move one of your pawns and then place one of your walls in any open groove. When you have no walls left you only move a pawn.",
    "A pawn moves two squares in a straight line (forward, backward or sideways) or one square diagonally. Walls may not be in the way: a diagonal step needs at least one of its two L-shaped routes free of walls.",
    "A pawn may jump over another pawn in its way. If the landing square of a straight move is taken by another pawn, the pawn may move just one square instead. Two pawns never share a square.",
    "Walls may not overlap or cross other walls. There must always be at least one open path, however devious, from every pawn to all four home spaces, so a home space can never be closed in by walls.",
    "If you cannot move either pawn you only place a wall; if you can do neither, you pass."]},
  {h:"Cul-de-Sac: winning",items:[
    "The first player to move a pawn onto either of the opponent’s home spaces wins. The winning move may be one or two squares.",
    "You may not protect a home space by leaving a pawn on it: the winner may move onto an occupied enemy home space and removes the pawn standing there."]},
  {h:"Variant: Quoridor",items:[
    "A 9×9 board. Each player has one pawn, starting in the middle of their first row: Light on e1 (south), Dark on e9 (north). Light moves first.",
    "Each player has 10 walls of one colour, which can be placed horizontally or vertically. A wall covers the side of two squares; walls may not overlap or cross.",
    "On your turn you either move your pawn one square orthogonally or place one wall. A wall may never cut off either pawn from every square of its goal row.",
    "If the pawns are face to face with no wall between them, you may jump over the opponent’s pawn. If a wall or the board edge is behind it, you may instead step diagonally to either side of it, unless a wall blocks that side.",
    "The first player to reach any square of the opponent’s first row (Light the north row, Dark the south row) wins."]},
  {h:"Notation",items:[
    "Squares are named by column letter (a, b, c… from west to east) and row number (1 in the south). A wall is named after the square just south-west of its centre, plus h or v: d3h lies along the north sides of d3 and e3, d3v along the east sides of d3 and d4."]}],
  stats:function(s,i){var F=fieldsOf(s)[i],d=pawnDist(s,i,F)[0],t=(d>=99?"no path":d+" move"+(d===1?"":"s")+" to goal")+" · ";
    if(V===0)t+=s.res[2*i]+" blue + "+s.res[2*i+1]+" green walls:";else t+="walls left:";
    return{big:V===0?s.res[2*i]+s.res[2*i+1]:s.res[2*i],text:"· "+t}},
  describe:function(s){return s.ev||""}
};
function build(v){
  V=v;var C=VARS[v],x;W=C.W;H=C.H;NC=W*H;NW=(W-1)*(H-1);NP=C.np;DD=[-W,1,W,-1];GAME.sides=C.sides;
  GOAL=[new Uint8Array(NC),new Uint8Array(NC)];
  if(v===0){
    HOMES=[[(H-4)*W+3,(H-4)*W+7],[3*W+3,3*W+7]];START=HOMES[0].concat(HOMES[1]);
    HOMES[1].forEach(function(c){GOAL[0][c]=1});HOMES[0].forEach(function(c){GOAL[1][c]=1});
  }else{
    HOMES=null;START=[(H-1)*W+4,4];
    for(x=0;x<W;x++){GOAL[0][x]=1;GOAL[1][(H-1)*W+x]=1}
  }
}
function cn(c){return String.fromCharCode(97+c%W)+(H-(c/W|0))}
function wname(o,k){var i=k%(W-1)+1,j=(k/(W-1)|0)+1;return cn(j*W+i-1)+(o?"v":"h")}
function nameOf(P){return GAME.sides[P].name}
function owner(k){return k/NP|0}
// is side d of cell c open? d: 0 N, 1 E, 2 S, 3 W
function op(bS,bE,c,d){
  switch(d){case 0:return c>=W&&!bS[c-W];case 1:return c%W<W-1&&!bE[c];case 2:return c<NC-W&&!bS[c];default:return c%W>0&&!bE[c-1]}
}
// Blockade steps that ignore pawns (two straight, or one diagonal along an open L): cb(target, via1, via2)
function hop(bS,bE,u,cb){
  var d,a,b,d1,d2,r1,r2;
  for(d=0;d<4;d++)if(op(bS,bE,u,d)){a=u+DD[d];if(op(bS,bE,a,d))cb(a+DD[d],a,-1)}
  for(d1=0;d1<4;d1+=2)for(d2=1;d2<4;d2+=2){
    a=u+DD[d1];b=u+DD[d2];r1=op(bS,bE,u,d1)&&op(bS,bE,a,d2);r2=op(bS,bE,u,d2)&&op(bS,bE,b,d1);
    if(r1||r2)cb(u+DD[d1]+DD[d2],r1?a:-1,r2?b:-1);
  }
}
// moves player P needs from each cell to reach one of P's goal cells (pawns ignored), 99 = cut off
function field(bS,bE,P){
  var D=new Int16Array(NC).fill(99),q=new Int16Array(NC),h=0,t=0,c,u,du,d,v,G=GOAL[P];
  for(c=0;c<NC;c++)if(G[c]){D[c]=0;q[t++]=c}
  function see(v){if(D[v]>du){D[v]=du;q[t++]=v}}
  while(h<t){u=q[h++];du=D[u]+1;
    if(V===1||G[u]){for(d=0;d<4;d++)if(op(bS,bE,u,d)){v=u+DD[d];if(D[v]>du){D[v]=du;q[t++]=v}}}
    if(V===0)hop(bS,bE,u,see);
  }
  return D;
}
function flood(bS,bE,src){
  var seen=new Uint8Array(NC),q=[src],h,u,d,v;seen[src]=1;
  for(h=0;h<q.length;h++){u=q[h];for(d=0;d<4;d++)if(op(bS,bE,u,d)){v=u+DD[d];if(!seen[v]){seen[v]=1;q.push(v)}}}
  return seen;
}
// Blockade: all home spaces and pawns in one open region. Quoridor: each pawn can still reach its goal row.
function connOK(bS,bE,pos){
  var s,i,x;
  if(V===0){s=flood(bS,bE,HOMES[0][0]);
    for(i=0;i<2;i++)if(!s[HOMES[1][i]]||!s[HOMES[0][i]])return false;
    for(i=0;i<pos.length;i++)if(pos[i]>=0&&!s[pos[i]])return false;
    return true}
  for(i=0;i<2;i++){s=flood(bS,bE,pos[i]);var ok=false;for(x=0;x<NC;x++)if(GOAL[i][x]&&s[x]){ok=true;break}if(!ok)return false}
  return true;
}
function geomOK(hw,vw,o,k){
  var i=k%(W-1)+1,j=(k/(W-1)|0)+1,R=W-1;
  if(hw[k]||vw[k])return false;                       // same centre: taken or crossing
  if(o===0)return!(i>1&&hw[k-1])&&!(i<W-1&&hw[k+1]);   // overlapping horizontal wall
  return!(j>1&&vw[k-R])&&!(j<H-1&&vw[k+R]);            // overlapping vertical wall
}
function wedges(o,k){var i=k%(W-1)+1,j=(k/(W-1)|0)+1;return o===0?[(j-1)*W+i-1,(j-1)*W+i]:[(j-1)*W+i-1,j*W+i-1]}
function wallsLeft(s,P,o){return V===0?s.res[2*P+o]:s.res[2*P]}
function occ(s,c){for(var i=0;i<s.pos.length;i++)if(s.pos[i]===c)return i;return -1}
function mk(pos,hw,vw,bS,bE,res,turn,ph,lm,ev){return{pos:pos,hw:hw,vw:vw,bS:bS,bE:bE,res:res,turn:turn,ph:ph,w:-1,lm:lm,ev:ev||"",f:null}}
function newState(){var r=VARS[V].walls,res=V===0?[r[0],r[1],r[0],r[1]]:[r[0],0,r[0],0];
  return mk(START.slice(),new Uint8Array(NW),new Uint8Array(NW),new Uint8Array(NC),new Uint8Array(NC),res,0,0,null,"")}
// destination cells of pawn k
function dests(s,k){
  var P=owner(k),c=s.pos[k],bS=s.bS,bE=s.bE,out=[],G=GOAL[P],d,a,b,d1,d2,t,p;
  function add(t){if(out.indexOf(t)<0)out.push(t)}
  function ent(t){return G[t]||occ(s,t)<0}           // an enemy home space may be entered even when a pawn stands on it
  if(c<0)return out;
  if(V===0){
    for(d=0;d<4;d++)if(op(bS,bE,c,d)){a=c+DD[d];if(G[a])add(a);
      if(op(bS,bE,a,d)){b=a+DD[d];if(ent(b))add(b);else if(occ(s,a)<0)add(a)}}
    for(d1=0;d1<4;d1+=2)for(d2=1;d2<4;d2+=2){a=c+DD[d1];b=c+DD[d2];
      if((op(bS,bE,c,d1)&&op(bS,bE,a,d2))||(op(bS,bE,c,d2)&&op(bS,bE,b,d1))){t=c+DD[d1]+DD[d2];if(ent(t))add(t)}}
  }else{
    var e=s.pos[1-P];
    for(d=0;d<4;d++){if(!op(bS,bE,c,d))continue;a=c+DD[d];
      if(a!==e){add(a);continue}
      if(op(bS,bE,a,d))add(a+DD[d]);
      else for(p=1;p<4;p+=2){t=(d+p)%4;if(op(bS,bE,a,t))add(a+DD[t])}}
  }
  return out;
}
function hasPawnMove(s,P){for(var k=P*NP;k<P*NP+NP;k++)if(dests(s,k).length)return true;return false}
function wallWhy(s,o,k){   // "" when player s.turn may place wall (o,k)
  var P=s.turn;
  if(wallsLeft(s,P,o)<=0)return V===0?"You have no "+VARS[0].wall[o].n+" walls left.":"You have no walls left.";
  if(!geomOK(s.hw,s.vw,o,k))return"That groove is taken: walls may not overlap or cross.";
  var e=wedges(o,k),bS=s.bS,bE=s.bE;
  if(o===0){bS=bS.slice();bS[e[0]]=bS[e[1]]=1}else{bE=bE.slice();bE[e[0]]=bE[e[1]]=1}
  if(!connOK(bS,bE,s.pos))return V===0?"That wall would cut off a pawn or a home space: an open path to all home spaces must remain.":"That wall would cut a pawn off from its goal row.";
  return"";
}
function anyWall(s){
  var o,k;for(o=0;o<2;o++)if(wallsLeft(s,s.turn,o)>0)for(k=0;k<NW;k++)if(geomOK(s.hw,s.vw,o,k)&&!wallWhy(s,o,k))return true;
  return false;
}
// start of a turn: skip the pawn move (or the whole turn) when it is impossible
function opening(s){
  var Q=s.turn;
  if(hasPawnMove(s,Q))return s;
  if(anyWall(s)){if(V===0)s.ph=1;s.ev=(s.ev+" "+nameOf(Q)+" cannot move a pawn and only places a wall.").trim();return s}
  s.ev=(s.ev+" "+nameOf(Q)+" can neither move nor place a wall and passes.").trim();
  s.passes=(s.passes||0)+1;s.turn=1-Q;s.ph=0;
  if(s.passes>=2){s.w=2;s.ev+=" Nobody can move: the game is a draw.";return s}
  return opening(s);
}
function doMove(s,k,to){
  var P=s.turn,pos=s.pos.slice(),from=pos[k],cap=occ(s,to),ns,lm={k:k,from:from,to:to,wall:null},
      txt=nameOf(P)+" moved "+cn(from)+"–"+cn(to)+".";
  if(cap>=0){pos[cap]=-1;txt+=" "+nameOf(1-P)+"’s pawn is removed from its home space."}
  pos[k]=to;
  if(GOAL[P][to]){ns=mk(pos,s.hw,s.vw,s.bS,s.bE,s.res,P,0,lm,txt+" "+nameOf(P)+" reaches "+(V===0?"one of ":"")+GAME.sides[P].goal+" and wins!");ns.w=P;ns.f=s.f;return{t:0,k:k,to:to,ns:ns}}
  if(V===0){ns=mk(pos,s.hw,s.vw,s.bS,s.bE,s.res,P,1,lm,txt);ns.f=s.f;
    if(ns.res[2*P]+ns.res[2*P+1]>0){if(anyWall(ns))return{t:0,k:k,to:to,ns:ns};txt+=" No wall can be placed."}}
  ns=mk(pos,s.hw,s.vw,s.bS,s.bE,s.res,1-P,0,lm,txt);ns.f=s.f;
  return{t:0,k:k,to:to,ns:opening(ns)};
}
function doWall(s,o,k){   // assumes the wall is legal
  var P=s.turn,hw=s.hw,vw=s.vw,bS=s.bS,bE=s.bE,res=s.res.slice(),e=wedges(o,k),lm,txt;

function click(e){
  if(over||busy||sim||browsing()||!humanTurn())return;
  var s=cur(),p=bpt(e),P=s.turn,w,c,k,own=-1,hits=[];note="";
  if(!p)return;
  if(V===1||s.ph===1){
    w=pickWall(s,p.x,p.y,V===0);
    if(w){if(w.k>=0){play(doWall(s,w.o,w.k).ns);return}note=w.why;render();return}
  }
  if(V===0&&s.ph===1){render();return}
  if(p.x<0||p.y<0||p.x>=W||p.y>=H)return;
  c=Math.floor(p.y)*W+Math.floor(p.x);
  if(!DST)return;
  for(k=P*NP;k<P*NP+NP;k++){if(s.pos[k]===c)own=k;if(DST[k]&&DST[k].indexOf(c)>=0)hits.push(k)}
  if(own>=0&&!hits.length){
    if(V===0){sel=sel===own?-1:own;if(!DST[own].length)note="That pawn has no legal move.";}
    render();return}
  if(sel>=0&&hits.indexOf(sel)>=0){play(doMove(s,sel,c).ns);return}
  if(hits.length===1){play(doMove(s,hits[0],c).ns);return}
  if(hits.length>1)note="Both pawns can reach "+cn(c)+": click the pawn you want to move first.";
  else note=V===0?"That square cannot be reached: a pawn moves two squares straight or one diagonally, and walls block the way.":"Your pawn cannot move there.";
  render();
}
function maybeAI(){
  if(over||$("mode").value!=="ai"||cur().turn===+$("side").value)return;
  busy=true;render();
  setTimeout(function(){
    var c=cur(),m=aiMove(c,+$("level").value,hist);busy=false;
    if(m){hist.push(m.ns);redo=[]}else{c.w=2;c.ev="No legal move: the game is a draw."}
    render();maybeAI();
  },60);
}
document.title=GAME.title;$("gtitle").textContent=GAME.title;
function li(x){return"<li>"+(typeof x==="string"?x:x.t+"<ul>"+x.sub.map(li).join("")+"</ul>")+"</li>"}
$("rules").innerHTML=GAME.rules.map(function(sec){return"<li><b>"+sec.h+"</b><ul>"+sec.items.map(li).join("")+"</ul></li>"}).join("");
$("board").onclick=click;
$("board").onpointermove=hover;
$("board").onpointerleave=function(){var g=$("pv");if(g)g.innerHTML=""};
$("new").onclick=start;$("sim").onclick=runSim;$("showLast").onchange=render;
$("mode").onchange=$("side").onchange=$("vr").onchange=start;
function aiSide(){return $("mode").value==="ai"&&cur().turn!==+$("side").value}
$("redo").onclick=function(){
  if(busy||sim)return;
  if(browsing()){unlock(1);return}
  if(!redo.length)return;
  hist.push(redo.pop());
  while(redo.length&&aiSide())hist.push(redo.pop());
  note="";render();
};
$("undo").onclick=function(){
  if(busy||sim)return;
  if(browsing()){unlock(-1);return}
  if(hist.length<2)return;
  redo.push(hist.pop());
  while(hist.length>1&&aiSide())redo.push(hist.pop());
  over=false;note="";render();maybeAI();
};
$("nFirst").onclick=function(){goto(0)};
$("nPrev").onclick=function(){goto((browsing()?view:hist.length-1)-1)};
$("nNext").onclick=function(){goto((browsing()?view:hist.length-1)+1)};
$("nLast").onclick=function(){goto(hist.length-1+redo.length)};
start();
})();
</script>
