<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{--bg:#eef0e6;--ink:#1f2a1c;--mute:#5d6a56;--cell:#dfe3cf;--edge:#b9bfa3;--hi:#e0803a;--panel:#fff;--line:#c5cab4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161c14;--ink:#e8ecdc;--mute:#9aa68f;--cell:#2a3325;--edge:#3b4733;--panel:#1f271c;--line:#37422f}}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
main{max-width:1080px;margin:0 auto;padding:16px 12px 40px}
h1{font:700 2rem/1.1 "Bricolage Grotesque",Georgia,serif;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--hi);transform:translateY(-2px);outline:none}
.thumb{background:var(--cell);border-bottom:1px solid var(--line);line-height:0}
.thumb{min-height:0}
.thumb img{display:block;width:100%;height:240px;object-fit:contain}
.body{padding:12px 14px 14px}
.body h2{font:700 1.3rem/1.2 "Bricolage Grotesque",Georgia,serif;margin:0 0 4px}
.body p{margin:0 0 8px;color:var(--mute);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.8rem;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.search{display:block;width:100%;max-width:420px;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 16px}
.search:focus{outline:2px solid var(--hi);outline-offset:1px}
.empty{color:var(--mute)}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
<div class="grid" id="grid"></div>
</main>
<script>
/* =====================================================================
   TO ADD A GAME:
   1. Put its HTML file in the same folder.
   2. Put a thumbnail PNG in the /images folder (about 840x600 works well).
   3. Add one entry to GAMES below. That's it.
   Fields: title, file, img (PNG thumbnail in /images), blurb, tags (short labels).
   ===================================================================== */
var SITE={title:"Abstract Games", subtitle:"A selection of abstract strategy games designed by João Pedro Neto"};

var GAMES=[
  {title:"Gonnect",
   file:"gonnect.html",
   blurb:"Go and Hex: link two opposite sides of the board with an orthogonal chain of your stones.",
   img:"images/gonnect.png",
   tags:["13x13","connection","2000"]},
   
  {title:"Desdemona",
   file:"desdemona.html",
   blurb:"Othello variant: a flipped enemy disk turns gray, and only a second flip makes it yours.",
   img:"images/desdemona.png",
   tags:["8x8","score","2000"]},
   
  {title:"Court",
   file:"court.html",
   blurb:"Pawns can be promoted, but some must remain for the game to continue.",
   img:"images/court.png",
   tags:["8x8","elimination","2001"]},
   
  {title:"Chicken Gomoku",
   file:"chicken_gomoku.html",
   blurb:"Gomoku on 9×9 with an auction: bid with black stones until one player takes Black.",
   img:"images/chicken_gomoku.png",
   tags:["13x13","auction","in-a-row","2001","co-designer: Bill Taylor"]},
   
  {title:"Unstack",
   file:"unstack.html",
   blurb:"Spread out for points but beware of the Big Bad Stacks eating you up.",
   img:"images/unstack.png",
   tags:["7x7","stack","2001"]},
   
  {title:"Galice",
   file:"galice.html",
   blurb:"Swap a stone to the other board, drop another, out-score your opponent.",
   img:"images/galice.png",
   tags:["2x7x7","territory","2002"]},
   
  {title:"Khan",
   file:"khan.html",
   blurb:"Soldiers race to the far row with the help of powerful Khans.",
   img:"images/khan.png",
   tags:["10x10","position","2002"]},
   
  {title:"Dispatch",
   file:"dispatch.html",
   blurb:"Send a stone sliding across the board and grow a shape where it lands.",
   img:"images/dispatch.png",
   tags:["13x13","territory","2002"]},
   
  {title:"Abstract Chess",
   file:"abstract_chess.html",
   blurb:"Chess variant where pieces can transfer part of their power.",
   img:"images/abstract_chess.png",
   tags:["8x8","stack","royal","2003"]},
   
  {title:"UN",
   file:"UN.html",
   blurb:"Slide the bureaucrat and leave a trail of files behind. Whoever cannot make more burocracy loses.",
   img:"images/UN.png",
   tags:["hexhex5","stalemate","2003"]},
   
  {title:"Stiletto",
   file:"stiletto.html",
   blurb:"Gomoku on 19×19 with a dagger: a one-use right to place two stones in the same turn.",
   img:"images/stiletto.png",
   tags:["19x19","in-a-row","2003","co-designer: Bill Taylor"]},
   
  {title:"Iqishiqi",
   file:"iqishiqi.html",
   blurb:"Push the neutral ball to your edges, one growing group of stones at a time.",
   img:"images/iqishiqi.png",
   tags:["hexhex8","position","2003"]},
   
  {title:"Send It",
   file:"send_it.html",
   blurb:"Place up to four stones a turn, each on a line of sight from your army.",
   img:"images/send_it.png",
   tags:["hexhex8","territory","2004"]},
   
  {title:"Nex",
   file:"nex.html",
   blurb:"Hex with a neutral twist.",
   img:"images/nex.png",
   tags:["hex11","connection","2004"]},
   
  {title:"Xana",
   file:"xana.html",
   blurb:"Drop and move stacks on a hexhex board, wall off space with neutral walls.",
   img:"images/xana.png",
   tags:["hex11","stack","territory","2005"]},
   
  {title:"Sesqui",
   file:"sesqui.html",
   blurb:"Drop a stone, then slide another like a queen. Connect your edges.",
   img:"images/sesqui.png",
   tags:["15x15","connection","2007","co-designer: Bill Taylor"]},
   
  {title:"Dozer Hex",
   file:"dozer_hex.html",
   blurb:"Hex where lines of stones bulldoze.",
   img:"images/dozer_hex.png",
   tags:["hex11","connection","2008","co-designer: Bill Taylor"]},
   
  {title:"Accumulation",
   file:"accumulation.html",
   blurb:"Slide your groups together, or remove a stone. Largest group wins.",
   img:"images/accumulation.png",
   tags:["hexhex5","unification","2010","co-designer: Bill Taylor"]},
   
  {title:"Pippinzip",
   file:"pippinzip.html",
   blurb:"Pip plods and Zip flies in this even-but-uneven asymmetrical battle.",
   img:"images/pippinzip.png",
   tags:["9x9","connection","2020","co-designer: Craig Duncan","co-designer: Bill Taylor"]},
   
  {title:"Sheepdogs",
   file:"sheepdogs.html",
   blurb:"Be the best pack of dogs and push the flock off the board.",
   img:"images/sheepdogs.png",
   tags:["8x8","score","2027","draft"]},
   
  {title:"HexSprawl",
   file:"hexsprawl.html",
   blurb:"Territorial game where stacks sprawl in several directions.",
   img:"images/hexsprawl.png",
   tags:["hexhex7","stack","score","2027","draft"]},

  {title:"Relay",
   file:"relay.html",
   blurb:"Hand a chain of supported pieces from your base to the far edge.",
   img:"images/relay.png",
   tags:["hex15","connection","2027","draft"]}
];

/* ---------------------------- rendering ---------------------------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function thumb(g){return g.img?'<img src="'+esc(g.img)+'" alt="" loading="lazy">':''}
document.title=SITE.title;
document.getElementById("title").textContent=SITE.title;
document.getElementById("sub").textContent=SITE.subtitle;
var grid=document.getElementById("grid"),box=document.getElementById("search");
function card(g){
  return '<a class="card" href="'+esc(g.file)+'"><div class="thumb">'+thumb(g)+'</div><div class="body"><h2>'+esc(g.title)+'</h2><p>'+esc(g.blurb||"")+'</p><div class="tags">'+(g.tags||[]).map(function(t){return"<span>"+esc(t)+"</span>"}).join("")+'</div></div></a>';
}
function show(){
  var words=box.value.toLowerCase().split(/\s+/).filter(Boolean);
  var list=GAMES.filter(function(g){
    var hay=(g.title+" "+(g.blurb||"")+" "+(g.tags||[]).join(" ")).toLowerCase();
    return words.every(function(w){return hay.indexOf(w)>=0});
  });
  grid.innerHTML=list.length?list.map(card).join(""):'<p class="empty">'+(GAMES.length?"No games match your search.":"No games yet.")+'</p>';
}
box.oninput=function(){
  show();
  // keep the address bar in sync so the search can be bookmarked or shared
  try{
    var u=new URL(location.href),v=box.value.trim();
    if(v)u.searchParams.set("q",v);else u.searchParams.delete("q");
    history.replaceState(null,"",u);
  }catch(e){}
};
// start with a search if the URL has ?q=word
try{box.value=new URLSearchParams(location.search).get("q")||""}catch(e){}
show();
</script>
</body>
</html>
