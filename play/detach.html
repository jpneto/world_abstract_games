<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detach</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{--bg:#f1efe9;--ink:#211f1b;--mute:#6a655b;--hi:#e0491b;--panel:#fff;--line:#cfc8b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--ink:#ecebe6;--mute:#a19d93;--panel:#222226;--line:#3d3b38}}
:root[data-theme="dark"]{--bg:#17171a;--ink:#ecebe6;--mute:#a19d93;--panel:#222226;--line:#3d3b38}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
main{max-width:1140px;margin:0 auto;padding:16px 12px 40px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.right>.bar:first-child{margin-top:0}
@media (min-width:880px){.layout{grid-template-columns:minmax(0,640px) minmax(290px,1fr);gap:28px;align-items:start}}
h1{font:700 2rem/1.1 "Bricolage Grotesque",Georgia,serif;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
select,button.ctl{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.ctl:disabled,select:disabled,input:disabled{opacity:.45;cursor:default}
label.f{color:var(--mute);font-size:.9rem}
input[type=number]{width:4.5em;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
button.ctl.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pl{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 12px}
.pl.on{border-color:var(--hi)}
.pl small{display:block;color:var(--mute)}
#status{min-height:3em;font-weight:600;margin:6px 0}
#board svg{display:block;width:100%;max-width:640px;margin:0 auto;touch-action:manipulation}
#board polygon[data-i]{cursor:pointer}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-top:16px}
summary{cursor:pointer;font-weight:600}
details li{margin:4px 0}
.legend{color:var(--mute);font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1 id="gtitle"></h1>
<p class="sub" id="gsub"></p>
<div class="layout">
<div class="left">
<div id="board"></div>
<p class="legend">Click one of your stones, then a destination (dots on empty cells, red rings on enemy stones you can swap with), then a dot where the second stone goes. Numbers on stones show their force. Cells are named by row (a–k, top to bottom) and position from the left; hover a cell to see its name.</p>
</div>
<aside class="right">
<div class="bar">
  <select id="mode" aria-label="Mode"><option value="ai">Play the computer</option><option value="2p">Two players</option></select>
  <select id="level" aria-label="Computer strength"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select>
  <select id="side" aria-label="Your colour"><option value="0">You play Black (moves first)</option><option value="1">You play White</option></select>
</div>
<div class="bar">
  <button class="ctl primary" id="new">New game</button>
  <button class="ctl" id="undo">Undo</button>
  <button class="ctl" id="redo">Redo</button>
  <label class="f"><input type="checkbox" id="ctl" checked> Show movable stones</label>
  <label class="f"><input type="checkbox" id="frc" checked> Show force</label>
</div>
<div class="score"><div class="pl" id="p0"><span id="n0"></span><small id="s0"></small></div><div class="pl" id="p1"><span id="n1"></span><small id="s1"></small></div></div>
<div id="status" aria-live="polite"></div>
<div id="last" class="legend" style="min-height:2.6em;margin:0 0 8px"></div>
<div class="bar">
  <label class="f">Simulation games <input id="simN" type="number" min="10" max="1000" value="10"></label>
  <label class="f">Random opening turns <input id="simR" type="number" min="0" max="20" value="2"></label>
  <button class="ctl" id="sim">Simulation</button>
</div>
<div id="simout" class="legend" style="white-space:pre-line;margin:0 0 8px"></div>
<details><summary>Rules</summary><ul id="rules"></ul></details>
</aside>
</div>
</main>
<script>
(function(){
/* 1. GAME DEFINITION (rules, move generation)  2. ENGINE (computer, simulation)  3. INTERFACE (SVG board, clicks)
   Board: hexhex of side 6 (91 cells), axial coordinates (q,r) with |q|,|r|,|q+r| <= 5. Cell index c runs row by row
   from the top, left to right; cells are named row letter a-k (top to bottom) + position from the left (1-based).
   State: {b: Uint8Array 91 (0 empty, 1 Black, 2 White), turn: 0 Black / 1 White, ply: turns played,
           F: force (group size) of the stone on each cell, cnt: [black, white] stone counts,
           mc: [black, white] number of legal detachments, ms: legal moves of the side to move (generated lazily),
           end: game over, w: winner 0/1 or -1, lm: last move}.
   Moves: {f: stone's cell X, t: destination, p: cell of the second stone, n: force, sw: true if t held an enemy stone}.
   A move of force n goes n cells along direction d; the second stone goes n cells from X along a different direction e. */
var $=function(i){return document.getElementById(i)};

/* ============================ 1. GAME DEFINITION ============================ */
var S=5,Q=[],R=[],ROW=[],POS=[],NC=0,RAY=[],NB=[];
var DQ=[1,1,0,-1,-1,0],DR=[0,-1,-1,0,1,1];          // E, NE, NW, W, SW, SE
var NAMES=["Black","White"],FILL=["#1d1d1f","#f6f5f0"],EDGE=["#000","#8a867c"];
// starting position: row by row from the top (x Black, o White)
var SETUP=["......",".x...o.","........",".........","..........",".o.......x.","..........",".........","........",".x...o.","......"];
(function(){var r,q,lo,hi,idx={},c,d,x,y,ray;
  for(r=-S;r<=S;r++){lo=Math.max(-S,-S-r);hi=Math.min(S,S-r);
    for(q=lo;q<=hi;q++){Q.push(q);R.push(r);ROW.push(r+S);POS.push(q-lo);idx[q+","+r]=NC++}}
  for(c=0;c<NC;c++){RAY[c]=[];NB[c]=[];
    for(d=0;d<6;d++){ray=[];x=Q[c]+DQ[d];y=R[c]+DR[d];
      while((x+","+y) in idx){ray.push(idx[x+","+y]);x+=DQ[d];y+=DR[d]}
      RAY[c].push(ray);if(ray.length)NB[c].push(ray[0])}}})();
function cn(c){return"abcdefghijk"[ROW[c]]+(POS[c]+1)}
var GAME={
  title:"Detach",
  subtitle:"Stones draw strength from their group: a stone moves as many cells as its group is large, and leaves a new stone behind the same distance away.",
  rules:function(){return[
  {h:"Board and players",items:["Played on a hexagonal board of 91 cells (6 cells per side) by Black and White.",
    "Each player starts with three stones: Black on b2, f10 and j2; White on b6, f2 and j6. Black moves first."]},
  {h:"Definitions",items:["A group is a set of one or more connected friendly stones (stones on adjacent cells).",
    "The force of a stone is the size of its group.",
    "A friendly path is a straight line of cells made only of empty cells and/or friendly stones. A stone moving along it jumps over the friendly stones.",
    "A stone of force N on cell X detaches by moving exactly N cells along a friendly path to a cell that is empty or holds an enemy stone of equal or lesser force. In the latter case the enemy stone goes to X: the two stones swap places.",
    "To complete the detachment, a second stone of the mover's colour is placed on an empty cell exactly N cells from X along another friendly path (a different direction)."]},
  {h:"Play",items:["On your turn you must detach one of your stones.",
    "The last player able to move wins: if you cannot detach any stone on your turn, you lose. There is no passing and no draw.",
    "Implementation notes: force is measured before the move, for both the moving stone and an enemy stone it would swap with. The cells passed over on the way (all but the last) may not hold enemy stones; the destination may not hold a friendly stone. The second stone comes from an unlimited supply, and a detachment is only legal if a place for it exists."]}]},
  describe:function(s){var l=s.lm,who;if(!l)return"";
    who=isAI()?pname(l.c)+" ("+NAMES[l.c]+")":NAMES[l.c];
    return who+" detached "+cn(l.f)+" (force "+l.n+") to "+cn(l.t)+(l.sw?", swapping places with a "+NAMES[1-l.c]+" stone, which went to "+cn(l.f):"")+", and placed a second stone on "+cn(l.p)+"."}
};
// group sizes: F[c] = size of the group the stone on c belongs to (0 for empty cells)
var STK=new Int16Array(91),MEM=new Int16Array(91);
function groups(b){var F=new Uint8Array(NC),c,v,sp,n,k,x,j,y;
  for(c=0;c<NC;c++)if(b[c]&&!F[c]){v=b[c];sp=0;n=0;STK[sp++]=c;F[c]=255;
    while(sp){x=STK[--sp];MEM[n++]=x;for(j=0;j<NB[x].length;j++){y=NB[x][j];if(b[y]===v&&!F[y]){F[y]=255;STK[sp++]=y}}}
    for(k=0;k<n;k++)F[MEM[k]]=n}
  return F}
// for the stone of player p on x: T[d]=1 if it can move along direction d, P[d]=1 if a second stone can go along d
function opts(b,F,x,p,T,P){var n=F[x],d,ray,k,v,t;
  for(d=0;d<6;d++){T[d]=P[d]=0;ray=RAY[x][d];if(ray.length<n)continue;
    for(k=0;k<n-1;k++){v=b[ray[k]];if(v&&v!==p)break}
    if(k<n-1)continue;
    t=ray[n-1];v=b[t];
    if(!v)T[d]=P[d]=1;else if(v!==p&&F[t]<=n)T[d]=1}}
var TT=[0,0,0,0,0,0],PP=[0,0,0,0,0,0];
function countMoves(b,F,p){var n=0,x,d,sp;
  for(x=0;x<NC;x++)if(b[x]===p){opts(b,F,x,p,TT,PP);sp=PP[0]+PP[1]+PP[2]+PP[3]+PP[4]+PP[5];
    for(d=0;d<6;d++)if(TT[d])n+=sp-PP[d]}
  return n}
function genMoves(b,F,p){var ms=[],x,d,e,n,t;
  for(x=0;x<NC;x++)if(b[x]===p){opts(b,F,x,p,TT,PP);n=F[x];
    for(d=0;d<6;d++)if(TT[d]){t=RAY[x][d][n-1];
      for(e=0;e<6;e++)if(e!==d&&PP[e])ms.push({f:x,t:t,p:RAY[x][e][n-1],n:n,sw:b[t]!==0})}}
  return ms}
function gen(s){return s.ms||(s.ms=genMoves(s.b,s.F,s.turn+1))}
function mkState(b,turn,ply,lm){var F=groups(b),cnt=[0,0],c,s;
  for(c=0;c<NC;c++)if(b[c])cnt[b[c]-1]++;
  s={b:b,turn:turn,ply:ply,F:F,cnt:cnt,mc:[countMoves(b,F,1),countMoves(b,F,2)],ms:null,end:false,w:-1,lm:lm};
  if(!s.mc[turn]){s.end=true;s.w=1-turn}   // the side to move cannot detach: the other player moved last and wins
  return s}
function newGame(){var b=new Uint8Array(NC),r,j,ch,c=0;
  for(r=0;r<SETUP.length;r++)for(j=0;j<SETUP[r].length;j++,c++){ch=SETUP[r][j];if(ch==="x")b[c]=1;else if(ch==="o")b[c]=2}
  return mkState(b,0,0,null)}
function apply(s,m){var me=s.turn+1,b=s.b.slice();
  b[m.f]=m.sw?b[m.t]:0;b[m.t]=me;b[m.p]=me;
  return mkState(b,1-s.turn,s.ply+1,{c:s.turn,f:m.f,t:m.t,p:m.p,n:m.n,sw:m.sw})}

/* ================================ 2. ENGINE ================================ */
/* Evaluation for the player to move: own legal detachments minus the opponent's (the last player able to move wins,
   so mobility is what matters). Finished games score -1e6 + ply for the side to move (it has lost; later losses are
   less bad, so the winner prefers quick wins). Search: negamax with alpha-beta over a beam of the best children by
   one-ply evaluation. Easy picks among the four best one-ply moves (always taking a win), Medium searches 2 plies,
   Hard deepens to 3 and then 4 plies within a time budget (keeping the deepest finished choice). */
function rn(n){return Math.floor(Math.random()*n)}
function ev(s){return s.mc[s.turn]-s.mc[1-s.turn]}
function term(s){return-1e6+s.ply}
var DEAD=0,NODES=0,ABORT={},BM={};
function kids(s){var ms=gen(s),ch=ms.map(function(m){return apply(s,m)}),
  sc=ch.map(function(c){return c.end?1e7:-ev(c)}),o=ch.map(function(_,i){return i});
  o.sort(function(x,y){return sc[y]-sc[x]});return{ms:ms,ch:ch,o:o}}
function nm(s,d,a,bt){var k,i,v,c,best=-1e9,lim;
  if(s.end)return term(s);
  if(d<=0)return ev(s);
  if((++NODES&7)===0&&DEAD&&Date.now()>DEAD)throw ABORT;
  k=kids(s);
  if(d===1){c=k.ch[k.o[0]];return c.end?-term(c):-ev(c)}
  lim=Math.min(k.o.length,BM[d]||8);
  for(i=0;i<lim;i++){v=-nm(k.ch[k.o[i]],d-1,-bt,-a);if(v>best){best=v;if(v>a){a=v;if(a>=bt)break}}}
  return best}
function search(s,d){var k=kids(s),i,v,best=-1e9,bi=k.o[0],lim;
  if(k.ch[bi].end||d<=1)return k.ms[bi];
  lim=Math.min(k.o.length,BM[d]||8);
  for(i=0;i<lim;i++){v=-nm(k.ch[k.o[i]],d-1,-1e9,-best+1e-9)+Math.random()*.5;
    if(v>best){best=v;bi=k.o[i]}}
  return k.ms[bi]}
function aiMove(s,lv){var ms=gen(s),best,k;
  if(lv===undefined)lv=+$("level").value;
  if(ms.length===1)return ms[0];
  if(lv<1)return ms[rn(ms.length)];
  if(lv===1){k=kids(s);if(k.ch[k.o[0]].end)return k.ms[k.o[0]];return k.ms[k.o[rn(Math.min(4,k.o.length))]]}
  if(lv===2){BM={2:8};return search(s,2)}
  BM={2:20,3:12,4:8};best=search(s,2);DEAD=Date.now()+(sim?250:1500);NODES=0;
  try{best=search(s,3);best=search(s,4)}catch(e){if(e!==ABORT)throw e}
  DEAD=0;return best}
var sim=null;
function runSim(){
  if(sim){sim.stop=true;return}
  var CAP=300,me=sim={stop:false},TOTAL=Math.max(10,Math.min(1000,+$("simN").value||10)),RND=Math.max(0,Math.min(20,isNaN(+$("simR").value)?2:+$("simR").value)),
      done=0,wc=[0,0,0],un=0,g=null,plies=0,len=0,lvName=$("level").options[$("level").selectedIndex].text,
      ids=["mode","side","level","new","undo","redo","simN","simR"];
  ids.forEach(function(i){$(i).disabled=true});
  $("sim").textContent="Stop simulation";
  $("simout").textContent="Simulating at "+lvName+" level… 0/"+TOTAL;
  function fin(stopped){
    sim=null;$("sim").textContent="Simulation";
    $("mode").disabled=$("new").disabled=$("simN").disabled=$("simR").disabled=false;
    $("level").disabled=$("side").disabled=$("mode").value==="2p";
    var pc=function(n){return done?(100*n/done).toFixed(1)+"%":"n/a"};
    $("simout").textContent=(stopped?"Stopped after ":"")+done+" games ("+lvName+" level, computer vs computer), first "+RND+" turns random.\nBlack (first player) won "+pc(wc[0])+", White won "+pc(wc[1])+(wc[2]?", draws "+pc(wc[2]):"")+". Average length: "+(done?(len/done).toFixed(0):"n/a")+" turns."+(un?" Unfinished (over "+CAP+" turns): "+un+".":"");
    render()}
  function step(){
    if(me.stop){fin(true);return}
    var t0=Date.now();
    while(Date.now()-t0<40){
      if(!g){g=newGame();plies=0}
      if(g.end||plies>=CAP){if(g.end)wc[g.w]++;else un++;len+=plies;done++;g=null;if(done>=TOTAL){fin(false);return}continue}
      g=apply(g,aiMove(g,plies<RND?0:undefined));plies++}
    $("simout").textContent="Simulating at "+lvName+" level… "+done+"/"+TOTAL;
    setTimeout(step,0)}
  step()}

/* =============================== 3. INTERFACE =============================== */
var hist,redo=[],over,busy,note="",sel={f:-1,t:-1};
var SQ3=Math.sqrt(3),HEXC=["#D18A45","#E8AE6F","#FFCE9F"],HEXP=[];
function cur(){return hist[hist.length-1]}
function hc(){return+$("side").value}
function isAI(){return $("mode").value==="ai"}
function isHuman(s){return!isAI()||s.turn===hc()}
function pname(c){return isAI()?(c===hc()?"You":"Computer"):NAMES[c]}
function pverb(c,a,b){return pname(c)==="You"?b:a}
function unsel(){sel.f=sel.t=-1}
function start(){hist=[newGame()];redo=[];note="";unsel();$("level").disabled=$("side").disabled=!isAI();over=false;busy=false;
  $("rules").innerHTML=GAME.rules().map(function(sec){return"<li><b>"+sec.h+"</b><ul>"+sec.items.map(li).join("")+"</ul></li>"}).join("");
  render();maybeAI()}
function X(c){return SQ3*(Q[c]+R[c]/2)}
function Y(c){return 1.5*R[c]}
function f3(v){return Math.round(v*1000)/1000}
// three-colouring: (q - r) mod 3 differs between any two neighbours
function hcol(c){return HEXC[((Q[c]-R[c])%3+4)%3]}
(function(){var c,k,a,p;for(c=0;c<NC;c++){p=[];for(k=0;k<6;k++){a=Math.PI/180*(60*k-90);p.push(f3(X(c)+Math.cos(a))+","+f3(Y(c)+Math.sin(a)))}HEXP[c]=p.join(" ")}})();
function ring(c,r,clr,w,dash){return'<circle cx="'+f3(X(c))+'" cy="'+f3(Y(c))+'" r="'+r+'" fill="none" stroke="'+clr+'" stroke-width="'+w+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' pointer-events="none"/>'}
function stone(c,v,op){return'<circle cx="'+f3(X(c))+'" cy="'+f3(Y(c))+'" r=".74" fill="'+FILL[v-1]+'" stroke="'+EDGE[v-1]+'" stroke-width=".06"'+(op?' opacity="'+op+'"':'')+' pointer-events="none"/>'}
function dot(c,r,clr,op,st){return'<circle cx="'+f3(X(c))+'" cy="'+f3(Y(c))+'" r="'+r+'" fill="'+clr+'"'+(op?' fill-opacity="'+op+'"':'')+(st?' stroke="'+st+'" stroke-width=".05"':'')+' pointer-events="none"/>'}
function line(a,b,clr,w){return'<line x1="'+f3(X(a))+'" y1="'+f3(Y(a))+'" x2="'+f3(X(b))+'" y2="'+f3(Y(b))+'" stroke="'+clr+'" stroke-width="'+w+'" stroke-linecap="round" pointer-events="none"/>'}
function txt(x,y,t,sz,clr,wt){return'<text x="'+f3(x)+'" y="'+f3(y)+'" font-size="'+sz+'" text-anchor="middle" dominant-baseline="central" fill="'+clr+'"'+(wt?' font-weight="'+wt+'"':'')+' pointer-events="none">'+t+'</text>'}
function render(){
  var s=cur(),b=s.b,g=[],c,i,r,l=s.lm,hu,stt,ms=gen(s),me=s.turn+1,mov={},tg=[],pl=[],first,last,HI="var(--hi)",RED="#c0392b";
  over=s.end;hu=isHuman(s)&&!over&&!busy&&!sim;
  ms.forEach(function(m){mov[m.f]=1});
  if(hu&&sel.f>=0){
    if(sel.t<0){var seen={};ms.forEach(function(m){if(m.f===sel.f&&!seen[m.t]){seen[m.t]=1;tg.push(m)}})}
    else pl=ms.filter(function(m){return m.f===sel.f&&m.t===sel.t})}
  g.push('<svg viewBox="-11.6 -9.1 23.2 18.2" role="img" aria-label="Detach board" font-family="system-ui,sans-serif">');
  for(c=0;c<NC;c++)g.push('<polygon data-i="'+c+'" points="'+HEXP[c]+'" fill="'+hcol(c)+'" stroke="#9c6430" stroke-width=".04" stroke-linejoin="round"><title>'+cn(c)+'</title></polygon>');
  for(r=0;r<11;r++){first=-1;for(c=0;c<NC;c++)if(ROW[c]===r){if(first<0)first=c;last=c}
    g.push(txt(X(first)-1.45,Y(first),"abcdefghijk"[r],.62,"var(--mute)"),txt(X(last)+1.45,Y(last),"abcdefghijk"[r],.62,"var(--mute)"))}
  // last move: a line from the stone's old cell to its new one, rings on the destination and the placed stone
  if(l&&sel.f<0){g.push(line(l.f,l.t,HI,.09),dot(l.f,.14,HI))}
  for(c=0;c<NC;c++)if(b[c]){g.push(stone(c,b[c]));
    if($("frc").checked)g.push(txt(X(c),Y(c)+.03,s.F[c],.7,FILL[2-b[c]],600))}
  if(l&&sel.f<0){g.push(ring(l.t,.86,HI,.09),ring(l.p,.86,HI,.09,".2 .14"))}
  if(hu){
    if(sel.f<0){if($("ctl").checked)for(c in mov)g.push(ring(+c,.86,HI,.07,".3 .18"))}
    else{
      g.push(ring(sel.f,.88,HI,.14));
      tg.forEach(function(m){g.push(m.sw?ring(m.t,.86,RED,.13,".32 .16"):dot(m.t,.24,FILL[s.turn],.75,EDGE[s.turn]))});
      if(sel.t>=0){g.push(line(sel.f,sel.t,HI,.09),stone(sel.t,me,.5),ring(sel.t,.88,HI,.12));
        pl.forEach(function(m){g.push(dot(m.p,.28,FILL[s.turn],.85,EDGE[s.turn]))})}}}
  $("board").innerHTML=g.join("")+'</svg>';
  for(i=0;i<2;i++){var mx=0;for(c=0;c<NC;c++)if(b[c]===i+1&&s.F[c]>mx)mx=s.F[c];
    $("p"+i).className="pl"+(!over&&s.turn===i?" on":"");
    $("p"+i).style.borderLeft="8px solid "+FILL[i];
    $("n"+i).textContent=pname(i)+" – "+NAMES[i]+": "+s.cnt[i]+" stone"+(s.cnt[i]===1?"":"s");
    $("s"+i).textContent=s.mc[i]+" possible detachment"+(s.mc[i]===1?"":"s")+" · largest force "+mx}
  if(over){stt=NAMES[s.turn]+" cannot detach any stone. Game over: "+pname(s.w)+(isAI()?" ("+NAMES[s.w]+")":"")+" "+pverb(s.w,"wins","win")+" by making the last move."}
  else{
    stt=isHuman(s)?(isAI()?"Your turn ("+NAMES[s.turn]+").":NAMES[s.turn]+" to move."):"The computer is thinking…";
    if(hu){
      if(sel.f<0)stt+=" Click one of your stones to detach it.";
      else if(sel.t<0)stt+=" Stone on "+cn(sel.f)+" (force "+s.F[sel.f]+"): click a destination "+s.F[sel.f]+" cell"+(s.F[sel.f]>1?"s":"")+" away.";
      else stt+=" Now click a dot to place the second stone "+s.F[sel.f]+" cell"+(s.F[sel.f]>1?"s":"")+" from "+cn(sel.f)+". Click "+cn(sel.t)+" again to choose another destination."}}
  if(note)stt+=" "+note;
  $("status").textContent=stt;
  $("last").textContent=GAME.describe(s);
  $("undo").disabled=hist.length<2||busy||!!sim;
  $("redo").disabled=!redo.length||busy||!!sim}
function play(m){var ns=apply(cur(),m);hist.push(ns);redo=[];note="";unsel();render();maybeAI()}
function click(i){
  var s=cur(),ms,a;
  if(over||busy||sim||!isHuman(s))return;
  note="";ms=gen(s);
  if(sel.f>=0&&sel.t>=0){
    a=ms.filter(function(m){return m.f===sel.f&&m.t===sel.t&&m.p===i})[0];
    if(a){play(a);return}
    if(i===sel.t||i===sel.f){sel.t=-1;render();return}}
  if(sel.f>=0&&i!==sel.f&&ms.some(function(m){return m.f===sel.f&&m.t===i})){sel.t=i;render();return}
  if(i===sel.f){unsel();render();return}
  if(s.b[i]===s.turn+1){
    if(ms.some(function(m){return m.f===i})){sel.f=i;sel.t=-1;render();return}
    unsel();note="The stone on "+cn(i)+" (force "+s.F[i]+") has no legal detachment.";render();return}
  if(sel.f<0)note=s.b[i]?"That's an enemy stone: click one of your own stones first.":"Click one of your own stones first.";
  else if(sel.t<0)note="The stone on "+cn(sel.f)+" can't detach to "+cn(i)+".";
  else note=cn(i)+" is not a legal cell for the second stone.";
  render()}
function maybeAI(){
  var s=cur();if(over||!isAI()||isHuman(s))return;
  busy=true;render();
  setTimeout(function(){var c=cur(),ns=apply(c,aiMove(c));busy=false;hist.push(ns);render();maybeAI()},60)}
function li(x){return"<li>"+x+"</li>"}
document.title=GAME.title;$("gtitle").textContent=GAME.title;$("gsub").textContent=GAME.subtitle;
$("board").onclick=function(e){var t=e.target.closest("[data-i]");if(t)click(+t.getAttribute("data-i"))};
$("new").onclick=start;$("sim").onclick=runSim;
$("ctl").onchange=$("frc").onchange=render;
$("mode").onchange=$("side").onchange=start;
$("redo").onclick=function(){
  if(busy||!redo.length)return;
  hist.push(redo.pop());
  while(isAI()&&redo.length&&!isHuman(cur()))hist.push(redo.pop());
  note="";unsel();render();maybeAI()};
$("undo").onclick=function(){
  if(busy||hist.length<2)return;
  var tmp=[];
  tmp.push(hist.pop());
  while(isAI()&&hist.length>1&&!isHuman(cur()))tmp.push(hist.pop());
  if(!isHuman(cur())&&isAI()){while(tmp.length)hist.push(tmp.pop());return}
  tmp.forEach(function(x){redo.push(x)});
  over=false;note="";unsel();render()};
start();
})();
</script>
